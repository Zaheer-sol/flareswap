[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.25"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{access = "read-write", path = "./deployments"}]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
coston2 = "${COSTON2_RPC_URL}"
flare = "${FLARE_RPC_URL}"

[etherscan]
coston2 = {key = "${FLARE_EXPLORER_API_KEY}", url = "https://coston2-explorer.flare.network/api", chain = 114}
flare = {key = "${FLARE_EXPLORER_API_KEY}", url = "https://flare-explorer.flare.network/api", chain = 14}
